name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# `secrets` 上下文不能在 `if:` 中直接使用，这里先把密钥映射到 workflow 级 env，
# 后续步骤通过 `env.KEYSTORE_BASE64` 来判断是否配置了签名。
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        # 项目未随仓库打包 gradle-wrapper.jar，CI 运行时生成完整 wrapper 后再用 ./gradlew 构建。
        run: gradle wrapper --gradle-version 8.5

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease

      - name: Build debug APK (no signing)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            SMS2Mail 自动构建产物。

            - 已配置签名 Secrets：产出**已签名 Release APK**，可直接安装使用；
            - 未配置签名 Secrets：产出 **Debug APK**（调试签名），可直接安装测试。
